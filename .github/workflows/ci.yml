name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'        # 每周一长跑（随机轮数放大 + ASan）

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          cc --version | head -1
          cargo --version
          python3 --version

      - name: Build + all suites (diff / HIL / unit / tiers)
        run: ./build.sh 200

      - name: Docs/code consistency
        run: python3 tools/check_docs.py

      - name: Official MCP SDK interop (third-party conformance)
        run: |
          cd tests/sdk_interop && npm install --silent
          node sdk_interop.mjs ../../build/btmcp_mock

      - name: MCP golden transcripts
        run: python3 tests/golden_replay.py

      - name: MCP spec conformance (structure)
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror -Icore/include \
             tests/test_conformance.c core/src/frame.c core/src/session.c \
             core/src/json.c core/src/writer.c core/src/mcp_server.c \
             core/src/err.c core/src/trace.c -o build/test_conformance
          ./build/test_conformance

      - name: Shared reassembly buffer (both configs)
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror -Icore/include \
             tests/test_shared_reasm.c core/src/frame.c core/src/trace.c \
             -o build/test_shared_reasm
          ./build/test_shared_reasm
          cc -O2 -std=c99 -Wall -Wextra -Werror -DBT_MCP_CFG_SHARED_REASM=1 \
             -Icore/include tests/test_shared_reasm.c core/src/frame.c \
             core/src/trace.c -o build/test_shared_reasm1
          ./build/test_shared_reasm1

      - name: Multi-instance concurrency under TSan
        run: |
          cc -O1 -g -std=c99 -fsanitize=thread -Icore/include \
             tests/test_threads.c core/src/frame.c core/src/session.c \
             core/src/json.c core/src/writer.c core/src/mcp_server.c \
             core/src/mcp_client.c core/src/err.c core/src/trace.c \
             -o build/test_threads_tsan -lpthread
          ./build/test_threads_tsan

      - name: Coverage gate (line/branch regression floor)
        run: ./tools/coverage.sh

      - name: FCS16 round-trip (no link-level CRC channels)
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror -DBT_MCP_CFG_FCS16=1 \
             -Icore/include tests/test_fcs16.c core/src/frame.c core/src/trace.c \
             -o build/test_fcs16
          ./build/test_fcs16

      - name: ASan + UBSan differencial runs
        run: ./build.sh 100 asan

      - name: Fuzz (1e7 rounds, crash-only gate)
        run: |
          cc -O2 -std=c99 -Icore/include -DBT_MCP_FUZZ_MAIN fuzz/fuzz_frame.c \
             core/src/frame.c core/src/trace.c -o build/fuzz_frame
          ./build/fuzz_frame 10000000
          # FCS16 模式也要 fuzz（该模式无链路级校验，是被 fuzz 覆盖最少的路径）
          cc -O2 -std=c99 -Icore/include -DBT_MCP_CFG_FCS16=1 -DBT_MCP_FUZZ_MAIN \
             fuzz/fuzz_frame.c core/src/frame.c core/src/trace.c -o build/fuzz_frame_fcs
          ./build/fuzz_frame_fcs 2000000

  long-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Long differential soak
        run: ./build.sh 5000
